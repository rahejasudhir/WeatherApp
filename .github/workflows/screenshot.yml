name: Capture Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Run emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            mkdir -p screenshots
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.an.trailers/.ui.weather.WeatherActivity
            sleep 10

            adb shell screencap -p /sdcard/screen1.png
            adb pull /sdcard/screen1.png screenshots/weather_current.png

            adb shell uiautomator dump /sdcard/ui.xml
            adb pull /sdcard/ui.xml /tmp/ui.xml
            python3 -c "
            import xml.etree.ElementTree as ET, re, sys
            tree = ET.parse('/tmp/ui.xml')
            for node in tree.iter():
                if 'temperature data' in node.get('text', '').lower():
                    nums = list(map(int, re.findall(r'\d+', node.get('bounds', ''))))
                    if len(nums) == 4:
                        print((nums[0]+nums[2])//2, (nums[1]+nums[3])//2)
                        sys.exit(0)
            " > /tmp/coords.txt || true

            if [ -s /tmp/coords.txt ]; then
              read X Y < /tmp/coords.txt
              adb shell input tap "$X" "$Y"
              sleep 6
            fi

            adb shell screencap -p /sdcard/screen2.png
            adb pull /sdcard/screen2.png screenshots/weather_std_dev.png

      - name: Commit screenshots to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshots/
          git diff --cached --quiet || git commit -m "Add app screenshots [skip ci]"
          git push
